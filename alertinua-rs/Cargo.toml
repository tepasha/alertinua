[package]
name = "alertinua"
version = "0.1.0"
authors = ["ported from tepasha/alertinua"]
edition = "2021"
resolver = "2"
rust-version = "1.77"

[[bin]]
name = "alertinua"
harness = false

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[features]
default = ["std", "esp-idf-svc/native"]
std = ["esp-idf-svc/binstart", "esp-idf-svc/std"]

[dependencies]
log = "0.4"
esp-idf-svc = { version = "0.51", default-features = false }
esp-idf-hal = "0.45"
esp-idf-sys = "0.36"
embedded-svc = "0.28"
anyhow = "1"
heapless = "0.8"
bytemuck = "1"
embedded-graphics = "0.8"
embedded-hal = "1"
display-interface-spi = "0.5"
mipidsi = "0.9"

[build-dependencies]
embuild = "0.33"
